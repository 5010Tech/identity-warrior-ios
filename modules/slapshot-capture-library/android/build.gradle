apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {

    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 27)
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dataBinding {
        enabled = true
    }
}

apply from: "dependencies.gradle"

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // slapshot libraries
    implementation files("libs/SlapshotCaptureSDK_$slapshotVersion/sciometrics-core-${slapshotVersion}.jar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/sciometrics-android-core-${slapshotVersion}.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/slapshot-core-${slapshotVersion}.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/slapshot-capture-${slapshotVersion}.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/slapshot-capture-face-${slapshotVersion}.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/slapshot-native-1.0.2.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/opencvlibrary411-2.0.2.aar")
    
    implementation files("libs/SlapshotCaptureSDK_$slapshotVersion/commons-math3-3.6.1.jar")
    // required for slapshot's implementation of nfiq
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/sciometrics-nfiq-${slapshotVersion}.aar")
    compileOnly files("libs/SlapshotCaptureSDK_$slapshotVersion/wsq-android-1.2.1.aar")
    // slapshot transient dependencies
    def daggerVersion = '2.28.3'
    implementation 'net.java.dev.jna:jna:5.6.0@aar'
    implementation 'com.google.mlkit:face-detection:16.1.7' // required for face dection
    implementation "com.google.dagger:dagger:${daggerVersion}"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation "androidx.fragment:fragment:1.6.2"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation 'io.reactivex.rxjava2:rxjava:2.1.13'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.9.0'
    // required for png export
    implementation 'ar.com.hjg:pngj:2.1.0'
       implementation (group: 'com.licensespring', name: 'androidsdk', version: '1.5.0', ext: 'aar', classifier: 'release')  { // required for licensing
        transitive=true
    }
}